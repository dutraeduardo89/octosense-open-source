name: octosense
description: OctoSense mobile and web client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  bloc: ^9.2.1
  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  get_it: ^8.3.0
  go_router: ^17.5.0
  health: ^11.1.0
  http: ^1.6.0
  lucide_icons_flutter: ^3.1.19
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5
  lottie: ^3.6.1
  flutter_confetti: ^0.9.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  archive: ^4.5.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/lottie/octosense_splash.json
    - assets/logos/

dependency_overrides:
  intl: 0.20.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E1116"
  adaptive_icon_foreground: "assets/icon/icon.png"
