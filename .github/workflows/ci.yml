name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

# Cancela runs antigos do mesmo branch se um novo push chegar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/api/OctoSense.slnx

      - name: Build
        run: dotnet build backend/api/OctoSense.slnx --no-restore --configuration Release

      # Testcontainers precisa de Docker. ubuntu-latest do GH Actions já tem.
      - name: Verify Docker available (Testcontainers)
        run: docker version

      - name: Test
        run: |
          dotnet test backend/api/OctoSense.slnx \
            --no-build \
            --configuration Release \
            --verbosity normal

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
