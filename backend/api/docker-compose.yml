services:
  mongo:
    image: mongo:7
    container_name: octosense-mongo
    restart: unless-stopped
    ports:
      - "37017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: octosense
      MONGO_INITDB_ROOT_PASSWORD: octosense_dev_password
      MONGO_INITDB_DATABASE: octosense
    volumes:
      - octosense_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  octosense_mongo_data:
